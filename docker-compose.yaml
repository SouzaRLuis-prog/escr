services:
  postgres:
    image: postgres:15-alpine
    container_name: escudo_rosa_postgres
    restart: always
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: escudo_rosa_redis
    restart: always
    volumes:
      - redis_data:/data

  chatwoot:
    image: chatwoot/chatwoot:v3.14.0
    container_name: escudo_rosa_chatwoot
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      - postgres
      - redis
    environment:
      - SECRET_KEY_BASE=escudorosa_secret_key_base_123456789_chatwoot
      - FRONTEND_URL=https://chat.ndsouza.online
      - WEB_SOCKET_URL=wss://chat.ndsouza.online/cable
      - FORCE_SSL=false
      - ACTION_CABLE_DISABLE_REQUEST_FORGERY_PROTECTION=true
      - ACTION_CABLE_ALLOWED_REQUEST_ORIGINS=*
      - ALLOW_EMBEDDED_IFRAMES=true
      - X_FRAME_OPTIONS=allowall
      - CW_ALLOWED_DOMAINS=escudo-teste.vercel.app,ndsouza.online
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_NAME=EscudoRosa
      - ACTIVE_STORAGE_SERVICE=local
    entrypoint: docker/entrypoints/rails.sh
    command: ["sh", "-c", "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"]

  chatwoot-worker:
    image: chatwoot/chatwoot:v3.14.0
    container_name: escudo_rosa_chatwoot_worker
    restart: always
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      - postgres
      - redis
    environment:
      - SECRET_KEY_BASE=escudorosa_secret_key_base_123456789_chatwoot
      - FRONTEND_URL=https://chat.ndsouza.online
      - WEB_SOCKET_URL=wss://chat.ndsouza.online/cable
      - FORCE_SSL=false
      - ACTION_CABLE_DISABLE_REQUEST_FORGERY_PROTECTION=true
      - ALLOW_EMBEDDED_IFRAMES=true
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - RAILS_ENV=production
      - ACTIVE_STORAGE_SERVICE=local
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-g", "default,interactive,scheduled_jobs,mailers,conversations"]

  evolution-api:
    image: evoapicloud/evolution-api:v1.8.2
    container_name: escudo_rosa_evolution
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_URL=https://chat.ndsouza.online
      - AUTHENTICATION_API_KEY=escudorosa123
      - DATABASE_ENABLED=false
      - DATABASE_PROVIDER=local
      - CACHE_REDIS_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Chrome

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: escudo_rosa_cloudflared
    restart: always
    depends_on:
      - chatwoot
    command: tunnel --protocol http2 --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  chatwoot_storage: